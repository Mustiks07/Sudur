name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Dependency rules
        run: |
          if [ -f tools/check_deps.sh ]; then bash tools/check_deps.sh; fi

      - name: Tests
        run: |
          set -e
          for dir in packages/*/ tools/*/ app/; do
            [ -d "${dir}test" ] || continue
            if grep -q "sdk: flutter" "${dir}pubspec.yaml"; then
              (cd "$dir" && flutter test)
            else
              (cd "$dir" && dart test)
            fi
          done

      - name: Build Android
        run: flutter build apk --debug --target lib/main_dev.dart
        working-directory: app

  prototype-profile-apk:
    name: Prototype profile APK (arm64)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64 profile APK
        run: >-
          flutter build apk
          --profile
          --target lib/main_dev.dart
          --target-platform android-arm64
          --split-per-abi
        working-directory: app

      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: sudur-prototype-profile-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk
          if-no-files-found: error
          retention-days: 14
